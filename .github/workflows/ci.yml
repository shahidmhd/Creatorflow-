name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contentrewards
          POSTGRES_PASSWORD: contentrewards
          POSTGRES_DB: contentrewards
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U contentrewards -d contentrewards"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://contentrewards:contentrewards@localhost:5432/contentrewards?schema=public
      JWT_SECRET: ci-only-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run test
      - run: npm run build
