services:
  - type: web
    name: creatorflow-api
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile --prod=false && pnpm --filter @creatorflow/api prisma:generate && pnpm --filter @creatorflow/api build
    startCommand: npx prisma db push --schema=apps/api/prisma/schema.prisma && npx tsx apps/api/prisma/seed.ts && pnpm --filter @creatorflow/api start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: creatorflow-db
          property: connectionString
      - key: APP_URL
        sync: false

databases:
  - name: creatorflow-db
    databaseName: creatorflow
    user: creatorflow_user
    plan: free
